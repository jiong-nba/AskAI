name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR or branch supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # swift test pulls HotKey; later steps reuse the same .build directory.
      - name: Unit tests (Swift Testing)
        run: swift test --disable-xctest
      - name: Release build
        run: swift build -c release
      - name: CLI against the local fixture
        run: python3 Tests/test_cli.py
      - name: Packager (signing failure, verification failure, replacement)
        run: bash Tests/test_packaging.sh
