name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR or branch supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # swift test pulls HotKey; later steps reuse the same .build directory.
      - name: Unit tests (Swift Testing)
        run: swift test --disable-xctest
      - name: Release build
        run: swift build -c release
      - name: CLI against the local fixture
        run: python3 Tests/test_cli.py
      - name: Packager (signing failure, verification failure, replacement)
        run: bash Tests/test_packaging.sh
      # Last: the extra flags invalidate the debug build the unit tests used.
      # Nothing may remain that becomes an error in the Swift 6 language mode.
      - name: Strict concurrency
        run: |
          set -o pipefail
          swift build -Xswiftc -strict-concurrency=complete 2>&1 | tee strict-concurrency.log
          if grep -q "this is an error in the Swift 6 language mode" strict-concurrency.log; then
            echo "Diagnostics that are errors in the Swift 6 language mode are back." >&2
            exit 1
          fi
